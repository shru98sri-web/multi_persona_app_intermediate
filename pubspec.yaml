name: tuition_bluepink_suite
description: Unified Tuition AI ML Super-App with interactive PDF reader, marks gradebook and ScriptGrade OCR evaluation.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  http: ^1.2.2
  file_picker: ^12.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  file_saver: ^0.2.14
  archive: ^4.6.0
  audioplayers: ^6.1.0
  camera: ^0.11.0+2
  flutter_email_sender: ^6.0.3
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  path_provider: ^2.1.4
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^13.1.0
  syncfusion_flutter_pdf: ^35.1.43
  syncfusion_flutter_pdfviewer: ^35.1.43
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/topics.json
    - assets/participants.json
    - assets/questions.json
    - assets/academic_marks.json
    - assets/sample_study_guide.pdf
